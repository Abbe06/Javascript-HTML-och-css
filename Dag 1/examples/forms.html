<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <!-- Inloggningsformulär -->
    <form action="action_page.cs">
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" 
        aria-label="username" placeholder="Username..." size="15" maxlength="10" required>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" 
        aria-label="password" placeholder="Password..." maxlength="20" required>

        <input type="submit" value="Submit">
    </form>
    <br>
    <hr>
    <!-- Textarea -->
     <label for="">Would you like to give us a comment?</label>
     <textarea name="comments" id="comments" cols="20" rows="4"></textarea>
    <br>
    <hr>
    <!-- Radoknappar -->
    <div>
        Please select yout favourite genre: <br>
        <label for="none">None</label>
        <input type="radio" name="genre" id="none" value="none" checked>
        
        <label for="rock">Rock</label>
        <input type="radio" name="genre" id="rock" value="rock">

        <label for="pop">Pop</label>
        <input type="radio" name="genre" id="pop" value="pop">

        <label for="jazz">Jazz</label>
        <input type="radio" name="genre" id="jazz" value="jazz">
    </div>
    <br>
    <hr>
    <!-- Fieldset för sektioner -->
    <fieldset>
        <legend>Contact details</legend>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email">
        <br>
        <label for="mobile">Mobile:</label>
        <input type="tel" name="mobile" id="mobile">
    </fieldset>
    <br>
    <hr>

    <!-- Checkbox -->
    <div>
        Please select yout favourite music service(s): <br>
        <label for="itunes">None</label>
        <input type="checkbox" name="service" id="itunes" value="itunes" checked>
        
        <label for="syntaxfm">Rock</label>
        <input type="checkbox" name="service" id="syntaxfm" value="syntaxfm">

        <label for="spotify">Pop</label>
        <input type="checkbox" name="service" id="spotify" value="spotify">
    </div>

    <!-- Drop-down listor -->
    <p>What device do you listen to music on?</p>
    <select name="devices" id="devices">
        <option value="ipod">iPod</option>
        <option value="radio">Radion</option>
        <option value="computer">Computer</option>
    </select>

    <!-- Datalist -->
    <input list="browsers" name="browsers">
    <datalist id="browsers">
        <option value="Egde"></option>
        <option value="Firefox"></option>
        <option value="Chrome"></option>
        <option value="Safari"></option>
    </datalist>

    <!-- Datumfält -->
     <label for="departure">departure date:</label>
     <input type="date" name="departure" id="departure">
     <input type="submit" value="Submit" disabled>

    <!-- Ladda upp en fil -->
    <input type="file" name="user-song" id="">
    <input type="submit" value="Upload">
    <br> <br>
    <!-- HTML validering -->
    <form>
        Quantity(between 1 and 10):
        <input type="number" name="quantity" id="quantity" required min="1" max="10">
        <input type="submit" value="Send">
    </form>

    <!-- Flera input typer -->
     Select a time:
     <input type="time" name="time" id="time">
     <br>
    Select a week:
    <input type="week" name="week" id="week">
    <br>
    Select a favourite color:
    <input type="color" name="color" id="color">
    <br>
    Your favourite website:
    <input type="url" name="portfolio" id="portfolio">
    <br>
    <input type="hidden" name="custID" value="3487">

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7816.713983990253!2d17.1234465293307!3d60.6731315487625!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4660c63fe65ad163%3A0x4b96fce1c270daac!2sBoulognerskogen!5e0!3m2!1sen!2sse!4v1792657664370!5m2!1sen!2sse" 
    width="600" height="450" 
    style="border:0;" allowfullscreen="" loading="lazy" 
    referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

</body>
</html>
