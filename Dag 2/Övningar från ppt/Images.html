<!DOCTYPE html>
<html>
	<head>
		<title>Images</title>
		<style type="text/css">
			body {
				color: #665544;
				background-color: #d4d0c6;
				background-image: url("images/backdrop.gif");
				font-family: Georgia, "Times New Roman", serif;
				text-align: center;}
			.wrapper {
				width: 720px;
				margin: 0px auto;}
			.header {
				margin: 40px 0px 20px 0px;}
			.header img{
				border: 5px dotted rgb(111, 89, 89);
			}
			.entry {
				width: 220px;
				float: left;
				margin: 10px;
				height: 198px;
				background-image: url("images/shadow.png");
				background-repeat: no-repeat;
				background-position: bottom;}
			figure {
				display: block;
				width: 202px;
				height: 170px;
				background-color: #e7e3d8;
				margin: 0;
				padding: 9px;
				text-align: left;}
			figure img {
				width: 200px;
				height: 150px;
				border: 1px solid #d6d6d6;}
			figcaption {
				background-image: url("images/icon.png");
				padding-left: 20px;
				background-repeat: no-repeat;}
			nav, footer {
				clear: both;
				color: #ffffff;
				background-color: #aeaca8;
				height: 30px;}
			nav ul {
				margin: 0px;
				padding: 5px 0px 5px 30px;}
			nav li {
				display: inline;
				margin-right: 40px;
				}
			nav li a {
				color: #ffffff;
				text-decoration: none;}
			nav li a:hover, nav li a.current {
				color: #000000;}
			footer {
				font-size: 80%;
				padding: 7px 0px 0px 20px;}
		</style>
	</head>
	<body>
		<header>
			<nav>
				<ul>
					<li><a href="">home</a></li>
					<li><a href="" class="current">galerie</a></li>
					<li><a href="">about</a></li>
					<li><a href="">contact</a></li>
				</ul>
			</nav>
		</header>
		<div class="wrapper">
			<div class="header">
				<img src="https://via.placeholder.com/728x90.png?text=IMAGES+LOGO+728x90" alt="Galerie" width="456" height="122" />
				<p>Here you can view all the images Placeholder.com provides.</p>
			</div>
			<div class="entry">
				<figure><img src="https://via.placeholder.com/220x198.png" alt="Image 1" />
					<figcaption>Image 1</figcaption>
				</figure>
			</div>
			<div class="entry">
				<figure><img src="https://via.placeholder.com/220x198.png" alt="Image 2" />
					<figcaption>Image 2</figcaption>
				</figure>
			</div>
			<div class="entry">
				<figure><img src="https://via.placeholder.com/220x198.png" alt="Image 3" />
					<figcaption>Image 3</figcaption>
				</figure>
			</div>
			<div class="entry">
				<figure><img src="https://via.placeholder.com/220x198.png" alt="Image 4" />
					<figcaption>Image 4</figcaption>
				</figure>
			</div>
			<div class="entry">
				<figure><img src="https://via.placeholder.com/220x198.png" alt="Image 5" />
					<figcaption>Image 5</figcaption>
				</figure>
			</div>
			<div class="entry">
				<figure><img src="https://via.placeholder.com/220x198.png" alt="Image 6" />
					<figcaption>Image 6</figcaption>
				</figure>
			</div>
		</div>
		<footer>© 2022 My website </footer>
	</body>
</html>
